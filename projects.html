<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex's Portfolio - Projects</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Added Vinyl Styling -->
    <style>
        .project-artwork-box {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        .project-img {
            width: 200px;
            height: 200px;
            /* Creates the Vinyl Shape */
            border-radius: 50%;
            object-fit: cover;
            /* Adds a slight dark border and shadow for depth */
            border: 4px solid #1a1a1a;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }

        /* The spinning animation for when the project is "playing" */
        @keyframes spin-vinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .playing-vinyl {
            animation: spin-vinyl 4s linear infinite;
        }
    </style>
</head>
<body>

    <header id="navbar">
        <nav class="nav-container">
            <div class="nav-links">
                <a href="index.html#aboutme" class="nav-link">
                    <img src="media/about.svg" alt="About Me" class="nav-icon"> About Me
                </a>
                <a href="projects.html" class="nav-link active">
                    <img src="media/projects.svg" alt="Projects" class="nav-icon"> Projects
                </a>
                <a href="blogs.html" class="nav-link">
                    <img src="media/blogs.svg" alt="Blogs" class="nav-icon"> Blogs
                </a>
                <a href="index.html#contacts" class="nav-link">
                    <img src="media/contact.svg" alt="Contact" class="nav-icon"> Contact
                </a>
            </div>
        </nav>
    </header>

    <main class="content-wrapper">
        <div class="spotify-player-container">
            
            <div id="topTrackCounter" class="top-track-counter">Track: 1/4</div>

            <div class="player-header">
                <span class="pulse-dot"></span>
                <span class="player-title">NOW BROWSING: PROJECTS_DECK</span>
            </div>

            <div class="project-artwork-box">
                <!-- Image defaults to code.png but will dynamically update -->
                <img id="projectImage" src="media/code.png" alt="Project Preview" class="project-img">
            </div>

            <div class="track-info-section">
                <h2 id="projectTitle">Project Title</h2>
                <p id="projectTech" class="tech-tag">HTML / CSS / JavaScript</p>
            </div>

            <div class="player-controls">
                <button id="prevBtn" class="control-btn" aria-label="Previous Project">
                    <img src="media/prev.svg" alt="Previous" class="control-icon">
                </button>
                <button id="playPauseBtn" class="control-btn main-play" aria-label="Play / Pause">
                    <img id="playPauseIcon" src="media/play.svg" alt="Play/Pause" class="control-icon">
                </button>
                <button id="skipBtn" class="control-btn" aria-label="Next Project">
                    <img src="media/skip.svg" alt="Skip" class="control-icon">
                </button>
            </div>

            <div id="expandedInfo" class="expanded-info-box hidden">
                <h3>Project Details</h3>
                <p id="projectDesc">Detailed description of the project architecture, features, and challenges overcome will appear here.</p>
                <a id="projectLink" href="#" target="_blank" class="cyber-icon-btn" aria-label="View Repository">
                    <img src="media/repo.svg" alt="Repository" class="control-icon">
                </a>
            </div>
        </div>
    </main>

<script>
    // ⚠️ ENTER YOUR EXACT GITHUB USERNAME HERE
    const githubUsername = "prodevmod"; 

    let projects = [];
    let currentIndex = 0;
    let isExpanded = false;

    // UI Elements
    const projectImage = document.getElementById('projectImage');
    const projectTitle = document.getElementById('projectTitle');
    const projectTech = document.getElementById('projectTech');
    const projectDesc = document.getElementById('projectDesc');
    const projectLink = document.getElementById('projectLink');
    const topTrackCounter = document.getElementById('topTrackCounter');
    
    const prevBtn = document.getElementById('prevBtn');
    const skipBtn = document.getElementById('skipBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playPauseIcon = document.getElementById('playPauseIcon');
    const expandedInfo = document.getElementById('expandedInfo');

    // 1. Fetch repositories from GitHub
    async function loadGitHubProjects() {
        projectTitle.textContent = "INITIALIZING...";
        projectTech.textContent = "Fetching GitHub API...";

        try {
            const response = await fetch(`https://api.github.com/users/${githubUsername}/repos?sort=updated`);
            const repos = await response.json();

            const originalRepos = repos.filter(repo => !repo.fork);

            projects = originalRepos.map(repo => ({
                title: repo.name,
                tech: repo.language ? repo.language : "Multi-Language / Text",
                fallbackDesc: repo.description || "No description provided.",
                link: repo.html_url,
                defaultBranch: repo.default_branch
            }));

            if (projects.length > 0) {
                updatePlayer();
            } else {
                projectTitle.textContent = "NO DATA FOUND";
                projectTech.textContent = "Check username.";
            }

        } catch (error) {
            console.error("GitHub API Error:", error);
            projectTitle.textContent = "CONNECTION FAILED";
            projectTech.textContent = "Offline or Rate Limited";
        }
    }

    // 2. Fetch the README for the current project and extract image + text
    async function fetchReadme(repoName, branch, fallbackText) {
        projectDesc.textContent = "Loading README data...";
        
        // Reset image to default while fetching
        projectImage.src = "media/code.png"; 

        try {
            const rawUrl = `https://raw.githubusercontent.com/${githubUsername}/${repoName}/${branch}/README.md`;
            const response = await fetch(rawUrl);
            
            if (response.ok) {
                let text = await response.text();
                
                // --- NEW: EXTRACT IMAGE ---
                // Looks for Markdown format ![alt](url) or HTML format <img src="url">
                const mdImgMatch = text.match(/!\[.*?\]\((.*?)\)/);
                const htmlImgMatch = text.match(/<img[^>]+src=["'](.*?)["']/i);
                
                let foundImageUrl = "media/code.png";
                
                if (mdImgMatch && mdImgMatch[1]) {
                    foundImageUrl = mdImgMatch[1];
                } else if (htmlImgMatch && htmlImgMatch[1]) {
                    foundImageUrl = htmlImgMatch[1];
                }

                // If a relative path is used in the repo, convert it to an absolute raw github URL
                if (foundImageUrl !== "media/code.png" && !foundImageUrl.startsWith("http")) {
                    foundImageUrl = foundImageUrl.replace(/^\.?\//, ''); // removes ./ or / at the start
                    foundImageUrl = `https://raw.githubusercontent.com/${githubUsername}/${repoName}/${branch}/${foundImageUrl}`;
                }
                
                projectImage.src = foundImageUrl;

                // --- THE UPGRADED CLEANER ---
                let cleanText = text
                    .replace(/<[^>]*>/g, '')          
                    .replace(/!\[.*?\]\(.*?\)/g, '')   
                    .replace(/https?:\/\/[^\s]+/g, '') 
                    .replace(/[#*`_>\[\]()]/g, '')     
                    .replace(/\s+/g, ' ')              
                    .trim();
                
                if (cleanText.length === 0) {
                    cleanText = fallbackText;
                }

                projectDesc.textContent = cleanText.substring(0, 250) + (cleanText.length > 250 ? '...' : '');
            } else {
                projectDesc.textContent = fallbackText;
            }
        } catch (e) {
            projectDesc.textContent = fallbackText;
        }
    }

    // 3. Update the Player UI
    function updatePlayer() {
        if (projects.length === 0) return;
        
        const current = projects[currentIndex];
        
        projectTitle.textContent = current.title.replace(/-/g, ' ').toUpperCase(); 
        projectTech.textContent = current.tech;
        projectLink.href = current.link;
        topTrackCounter.textContent = `Track: ${currentIndex + 1}/${projects.length}`;

        // Reset expanded state on track change
        if (isExpanded) {
            isExpanded = false;
            expandedInfo.classList.add('hidden');
            playPauseIcon.src = "media/play.svg";
            projectImage.classList.remove('playing-vinyl');
        }

        fetchReadme(current.title, current.defaultBranch, current.fallbackDesc);
    }

    // Navigation Controls
    skipBtn.addEventListener('click', () => {
        if (projects.length === 0) return;
        currentIndex = (currentIndex + 1) % projects.length;
        updatePlayer();
    });

    prevBtn.addEventListener('click', () => {
        if (projects.length === 0) return;
        currentIndex = (currentIndex - 1 + projects.length) % projects.length;
        updatePlayer();
    });

    // Expand / Collapse Info & Spin Vinyl
    playPauseBtn.addEventListener('click', () => {
        isExpanded = !isExpanded;
        if (isExpanded) {
            expandedInfo.classList.remove('hidden');
            playPauseIcon.src = "media/pause.svg";
            projectImage.classList.add('playing-vinyl'); // Start spinning
        } else {
            expandedInfo.classList.add('hidden');
            playPauseIcon.src = "media/play.svg";
            projectImage.classList.remove('playing-vinyl'); // Stop spinning
        }
    });

    // Boot up the system!
    loadGitHubProjects();
</script>
    <script src="script.js"></script>
</body>
</html>
