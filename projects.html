<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex's Portfolio - Projects</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="media/favicon.png">
</head>
<body>

    <!-- HIDDEN BACKGROUND AUDIO -->
    <audio id="bg-music" loop autoplay>
        <source src="8-bit_hero.wav" type="audio/wav">
    </audio>

    <main class="content-wrapper">
        
        <!-- PROJECT SELECTOR SECTION -->
        <section class="full-screen-section">
            <div class="terminal-box" style="width: 95%; max-width: 900px; padding: 40px 60px; min-height: 550px;">
                
                <div id="topTrackCounter" class="top-track-counter" style="font-size: 1.2rem;">PROJECT: 1/4</div>

                <div class="player-header">
                </div>

                <div class="project-artwork-box">
                    <img id="projectImage" src="media/code.png" alt="Project Preview" class="project-img">
                </div>

                <div class="track-info-section">
                    <h2 id="projectTitle" style="font-size: 2rem;">Project Title</h2>
                    <p id="projectTech" class="tech-tag" style="font-size: 1rem;">Tech Stack</p>
                </div>

                <div class="player-controls">
                    <button id="prevBtn" class="control-btn" aria-label="Previous Project">
                        <img src="media/previous.png" alt="Previous" class="control-icon">
                    </button>
                    <!-- Play button replaced with Repo link -->
                    <a id="repoLink" href="#" target="_blank" class="control-btn main-play" aria-label="View Repository">
                        <img src="media/github.png" alt="Repository" class="control-icon">
                    </a>
                    <button id="skipBtn" class="control-btn" aria-label="Next Project">
                        <img src="media/skip.png" alt="Next" class="control-icon">
                    </button>
                </div>

            </div>
        </section>

        <!-- UNIVERSAL HUB SECTION (End of page) -->
        <section id="hub" class="full-screen-section hub-container">
            <h2 class="hub-heading">Navigation Hub</h2>
            <div class="scattered-grid">
                <a href="index.html#qualifications" class="pixel-node node-qual">
                    <img src="media/node-qualifications.png" alt="Qualifications" class="pixel-img">
                    <span class="node-label">Qualifications</span>
                </a>
                <a href="projects.html" class="pixel-node node-proj">
                    <img src="media/node-projects.png" alt="Projects" class="pixel-img">
                    <span class="node-label">Projects</span>
                </a>
                <a href="index.html#aboutme" class="pixel-node node-about">
                    <img src="media/node-me.png" alt="About Me" class="pixel-img">
                    <span class="node-label">About Me</span>
                </a>
                <a href="blog.html" class="pixel-node node-blog">
                    <img src="media/node-blog.png" alt="Blog" class="pixel-img">
                    <span class="node-label">Blog</span>
                </a>
                <a href="index.html#contacts" class="pixel-node node-contact">
                    <img src="media/node-contact.png" alt="Contact" class="pixel-img">
                    <span class="node-label">Contact</span>
                </a>
            </div>
        </section>

        <!-- Mute Button (Top Left) -->
<button id="mute-btn" class="mute-btn" aria-label="Toggle Mute">
    <img src="media/mute.png" alt="Mute Icon">
</button>h

    </main>

<script>
    // --- BACKGROUND MUSIC LOGIC ---
    document.addEventListener('DOMContentLoaded', () => {
        const bgMusic = document.getElementById('bg-music');
        
        bgMusic.play().catch(error => {
            document.body.addEventListener('click', () => {
                if (bgMusic.paused) {
                    bgMusic.play();
                }
            }, { once: true });
        });
    });
    // ------------------------------

    const githubUsername = "prodevmod"; 

    let projects = [];
    let currentIndex = 0;

    const projectImage = document.getElementById('projectImage');
    const projectTitle = document.getElementById('projectTitle');
    const projectTech = document.getElementById('projectTech');
    const repoLink = document.getElementById('repoLink'); // Updated reference
    const topTrackCounter = document.getElementById('topTrackCounter');
    
    const prevBtn = document.getElementById('prevBtn');
    const skipBtn = document.getElementById('skipBtn');

    async function loadGitHubProjects() {
        projectTitle.textContent = "LOADING...";
        projectTech.textContent = "Querying GitHub API...";

        try {
            const response = await fetch(`https://api.github.com/users/${githubUsername}/repos?sort=updated`);
            const repos = await response.json();

            const originalRepos = repos.filter(repo => !repo.fork);

            projects = originalRepos.map(repo => ({
                title: repo.name,
                tech: repo.language ? repo.language : "Multi-Language / Script",
                link: repo.html_url,
                defaultBranch: repo.default_branch
            }));

            if (projects.length > 0) {
                updatePlayer();
            } else {
                projectTitle.textContent = "NO PROJECTS FOUND";
                projectTech.textContent = "Check username.";
            }

        } catch (error) {
            console.error("GitHub API Error:", error);
            projectTitle.textContent = "CONNECTION FAILED";
            projectTech.textContent = "Offline or Rate Limited";
        }
    }

    // Still fetches the README just to find a thumbnail image
    async function fetchReadmeImage(repoName, branch) {
        projectImage.src = "media/code.png"; 

        try {
            const rawUrl = `https://raw.githubusercontent.com/${githubUsername}/${repoName}/${branch}/README.md`;
            const response = await fetch(rawUrl);
            
            if (response.ok) {
                let text = await response.text();
                
                const mdImgMatch = text.match(/!\[.*?\]\((.*?)\)/);
                const htmlImgMatch = text.match(/<img[^>]+src=["'](.*?)["']/i);
                
                let foundImageUrl = "media/code.png";
                
                if (mdImgMatch && mdImgMatch[1]) {
                    foundImageUrl = mdImgMatch[1];
                } else if (htmlImgMatch && htmlImgMatch[1]) {
                    foundImageUrl = htmlImgMatch[1];
                }

                if (foundImageUrl !== "media/code.png" && !foundImageUrl.startsWith("http")) {
                    foundImageUrl = foundImageUrl.replace(/^\.?\//, '');
                    foundImageUrl = `https://raw.githubusercontent.com/${githubUsername}/${repoName}/${branch}/${foundImageUrl}`;
                }
                
                projectImage.src = foundImageUrl;
            }
        } catch (e) {
            console.error("No README image found.");
        }
    }

    function updatePlayer() {
        if (projects.length === 0) return;
        
        const current = projects[currentIndex];
        
        projectTitle.textContent = current.title.replace(/-/g, ' ').toUpperCase(); 
        projectTech.textContent = current.tech;
        
        // Dynamically assign the link to the middle button
        repoLink.href = current.link;
        
        topTrackCounter.textContent = `PROJECT: ${currentIndex + 1}/${projects.length}`;

        fetchReadmeImage(current.title, current.defaultBranch);
    }

    skipBtn.addEventListener('click', () => {
        if (projects.length === 0) return;
        currentIndex = (currentIndex + 1) % projects.length;
        updatePlayer();
    });

    prevBtn.addEventListener('click', () => {
        if (projects.length === 0) return;
        currentIndex = (currentIndex - 1 + projects.length) % projects.length;
        updatePlayer();
    });

    loadGitHubProjects();
</script>
    <div class="walking-avatar-container">
        <img src="media/walking.gif" alt="Walking Avatar" class="pixel-avatar">
    </div>
<!-- Press H Hint Badge -->
<div class="hub-hint-badge">
    Press <strong>H</strong> for Hub
</div>
<script src="script.js"></script>
</body>
</html>
